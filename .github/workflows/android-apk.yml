name: Build and publish Android APK

on:
  push:
    branches:
      - arena/70abdb3d-4
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build offline Android game
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bundle offline WebGL game
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble signed debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk Polyground-Android.apk

      - name: Store workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polyground-Android-APK
          path: Polyground-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the current APK to the stable GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: android-v1
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Polyground-Android.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" Polyground-Android.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "POLYGON 01 — Android APK" \
              --notes-file .github/release-notes.md
          fi
