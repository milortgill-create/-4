plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.arena.polyground'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.arena.polyground'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.7.1'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
